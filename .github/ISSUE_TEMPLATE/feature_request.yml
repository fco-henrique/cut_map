name: Sugerir melhoria
description: Proponha uma funcionalidade ou mudança de comportamento.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema ou necessidade
      description: Explique o que a pessoa usuária precisa fazer.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solução proposta
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite
      description: Descreva como verificar que a melhoria ficou pronta.
    validations:
      required: true
