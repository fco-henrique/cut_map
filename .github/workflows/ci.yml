name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cut-map
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/cut-map/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand

  flutter:
    name: Flutter (análise e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/cut_map
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
